<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Gradient Loader</title>
    <style>
        .loader {
            width: 50px;
            aspect-ratio: 1;
            border-radius: 50%;
            background: 
                radial-gradient(farthest-side, #f03355 95%, transparent) 50% 1px / 12px 12px no-repeat,
                radial-gradient(farthest-side, transparent calc(100% - 14px), #ccc 0);
            animation: spin 2s infinite linear;
        }

        @keyframes spin {
            to { transform: rotate(1turn); }
        }

        /* Optional: Center the loader on the page */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }
    </style>
</head>
<body>
    <div class="loader"></div>
</body>
</html>
